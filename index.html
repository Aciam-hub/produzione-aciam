async function open_(auto){const b=document.getElementById('go'),e=document.getElementById('err');b.disabled=true;e.textContent='';
try{const pw=typeof auto==='string'?auto:document.getElementById('pw').value;
const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.salt),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.iv)},key,u(P.ct)));
document.open();document.write(html);document.close();}
catch(x){e.textContent=typeof auto==='string'?'Il link non contiene la chiave giusta: inserisci la password.':'Password non corretta.';b.disabled=false;}}
